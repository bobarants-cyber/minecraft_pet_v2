<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bbokari + FaceAway: an eye whose iris is Bbokari's face, ringed with honeycomb, with little bee wings,
       inside FaceAway's Face ID brackets. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2f7a"/><stop offset="0.55" stop-color="#1a1a4a"/><stop offset="1" stop-color="#0d0c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ffcf4a" stop-opacity="0.55"/><stop offset="0.45" stop-color="#ff9f2e" stop-opacity="0.18"/><stop offset="1" stop-color="#ff9f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#fff07a"/><stop offset="0.55" stop-color="#ffd23a"/><stop offset="1" stop-color="#f2a417"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff3ff"/><stop offset="1" stop-color="#3d7bff"/>
    </linearGradient>
    <pattern id="hex" width="40" height="34.64" patternUnits="userSpaceOnUse" patternTransform="translate(6 3)">
      <path d="M10 0h20l10 17.32-10 17.32H10L0 17.32z" fill="none" stroke="#b86e00" stroke-width="3" opacity="0.55"/>
    </pattern>
    <clipPath id="eyeClip"><path d="M150 520 C 290 300, 734 300, 874 520 C 734 740, 290 740, 150 520 Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <!-- squircle -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="230" cy="250" r="4" opacity="0.8"/><circle cx="790" cy="230" r="3" opacity="0.7"/><circle cx="840" cy="400" r="2.5" opacity="0.6"/>
    <circle cx="190" cy="760" r="3" opacity="0.5"/><circle cx="300" cy="180" r="2" opacity="0.6"/><circle cx="720" cy="820" r="2.5" opacity="0.5"/>
    <path d="M820 300 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" opacity="0.85"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>

  <!-- Face ID brackets -->
  <g fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" opacity="0.95">
    <path d="M205 330 V270 a62 62 0 0 1 62 -62 H327"/>
    <path d="M697 208 H757 a62 62 0 0 1 62 62 V330"/>
    <path d="M205 710 V770 a62 62 0 0 0 62 62 H327"/>
    <path d="M697 832 H757 a62 62 0 0 0 62 -62 V710"/>
  </g>

  <!-- bee wings behind the eye -->
  <g filter="url(#shadow)">
    <path d="M470 318 C 380 170, 250 200, 290 290 C 315 350, 410 360, 470 330 Z" fill="url(#wing)" stroke="#ffffff" stroke-width="6"/>
    <path d="M554 318 C 644 170, 774 200, 734 290 C 709 350, 614 360, 554 330 Z" fill="url(#wing)" stroke="#ffffff" stroke-width="6"/>
    <path d="M440 300 C 395 250, 345 245, 330 270" fill="none" stroke="#9fd8ff" stroke-width="5" opacity="0.8"/>
    <path d="M584 300 C 629 250, 679 245, 694 270" fill="none" stroke="#9fd8ff" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- the eye -->
  <path d="M150 520 C 290 300, 734 300, 874 520 C 734 740, 290 740, 150 520 Z" fill="#7ff3ff" opacity="0.5" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <path d="M150 520 C 290 300, 734 300, 874 520 C 734 740, 290 740, 150 520 Z" fill="url(#sclera)"/>
  </g>
  <g clip-path="url(#eyeClip)">
    <!-- iris: honeycomb ring with Bbokari's face in the middle -->
    <circle cx="512" cy="520" r="200" fill="url(#iris)"/>
    <circle cx="512" cy="520" r="200" fill="url(#hex)"/>
    <circle cx="512" cy="520" r="200" fill="none" stroke="#c97a00" stroke-width="10"/>
    <circle cx="512" cy="520" r="150" fill="#ffdf55"/>
    <circle cx="512" cy="520" r="150" fill="url(#iris)" opacity="0.6"/>
    <!-- Bbokari's tuft -->
    <path d="M500 372 C 470 330, 520 300, 545 330 C 530 320, 510 335, 528 368 Z" fill="#ffd23a" stroke="#e6a516" stroke-width="5"/>
    <!-- face -->
    <circle cx="462" cy="512" r="20" fill="#2b1d14"/><circle cx="562" cy="512" r="20" fill="#2b1d14"/>
    <circle cx="469" cy="504" r="7" fill="#fff"/><circle cx="569" cy="504" r="7" fill="#fff"/>
    <ellipse cx="428" cy="558" rx="24" ry="14" fill="#ff8a8a" opacity="0.7"/><ellipse cx="596" cy="558" rx="24" ry="14" fill="#ff8a8a" opacity="0.7"/>
    <path d="M488 548 Q512 534 536 548 Q524 574 512 576 Q500 574 488 548 Z" fill="#ff8c2a" stroke="#d96a10" stroke-width="4"/>
    <!-- shine on the eye -->
    <ellipse cx="420" cy="420" rx="46" ry="26" fill="#ffffff" opacity="0.75" transform="rotate(-25 420 420)"/>
    <circle cx="610" cy="430" r="10" fill="#ffffff" opacity="0.7"/>
    <!-- lash line -->
  </g>
  <path d="M150 520 C 290 300, 734 300, 874 520 C 734 740, 290 740, 150 520 Z" fill="none" stroke="#11122e" stroke-width="12"/>
  <path d="M150 520 C 290 300, 734 300, 874 520" fill="none" stroke="#11122e" stroke-width="22" stroke-linecap="round"/>

  <!-- a tiny bee buzzing around, with a dotted trail -->
  <g transform="translate(742 690) rotate(-18)">
    <g fill="#ffffff" opacity="0.85"><circle cx="-95" cy="40" r="7"/><circle cx="-66" cy="28" r="8"/><circle cx="-36" cy="16" r="9"/></g>
    <ellipse cx="18" cy="-26" rx="20" ry="13" fill="#e8f7ff" opacity="0.9" transform="rotate(-30 18 -26)"/>
    <ellipse cx="40" cy="-24" rx="18" ry="12" fill="#e8f7ff" opacity="0.9" transform="rotate(25 40 -24)"/>
    <ellipse cx="30" cy="0" rx="40" ry="28" fill="#ffd23a" stroke="#2b1d14" stroke-width="6"/>
    <path d="M18 -26 V26 M40 -27 V27" stroke="#2b1d14" stroke-width="10"/>
    <circle cx="60" cy="-6" r="5" fill="#2b1d14"/>
    <path d="M-10 0 l-14 0" stroke="#2b1d14" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
