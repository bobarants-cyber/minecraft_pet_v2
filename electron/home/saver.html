<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Screen saver</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; img-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 1.2s; }
  canvas.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="saver.js"></script>
</body>
</html>
