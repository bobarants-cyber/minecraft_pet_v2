# Bbokari for iPhone. Make the Xcode project with:  brew install xcodegen && xcodegen
name: Bbokari
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Your free Apple ID needs its own unique bundle id; change "bobarants" if Xcode says it's taken.
    BUNDLE_BASE: com.bobarants.bbokari
targets:
  Bbokari:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bbokari
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: Save photos of Bbokari to your library.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleDarkContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BbokariWidget
  BbokariWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - Resources/Assets.xcassets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bbokari
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE).widget
