<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob: ws://localhost:5173 http://localhost:5173" />
    <title>Minecraft Mob</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      body.grab {
        cursor: grab;
      }
      body.grab:active {
        cursor: grabbing;
      }
      .mob-menu {
        position: fixed;
        z-index: 10;
        min-width: 230px;
        padding: 6px;
        box-sizing: border-box;
        border-radius: 14px;
        background: rgba(44, 44, 46, 0.96);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 32px rgba(0, 0, 0, 0.4);
        color: #fff;
        font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
        opacity: 0;
        transform: scale(0.96);
        visibility: hidden;
        transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
      }
      .mob-menu {
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .mob-menu__quit {
        margin-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 0 0 9px 9px;
        color: #ffb3b3;
      }
      .mob-menu.open {
        opacity: 1;
        transform: none;
        visibility: visible;
        transition-delay: 0s;
      }
      .mob-menu__row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 28px;
        width: 100%;
        padding: 9px 12px;
        box-sizing: border-box;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .mob-menu__row:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .mob-menu__value {
        opacity: 0.85;
      }
      .mob-menu__text {
        padding: 8px 12px 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        margin-top: 4px;
      }
      .mob-menu__text-label {
        font-size: 12.5px;
        opacity: 0.75;
      }
      .mob-menu__chips {
        display: flex;
        gap: 6px;
        margin-top: 7px;
      }
      .mob-menu__chip {
        flex: 1;
        padding: 6px 4px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        font: 600 12.5px/1.1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .mob-menu__chip:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .mob-menu__chips--wrap {
        flex-wrap: wrap;
      }
      .mob-menu__chips--wrap .mob-menu__chip {
        flex: 1 1 auto;
        padding: 6px 9px;
      }
      .mob-menu__chip.is-on {
        background: #ffd23f;
        color: #2b2412;
      }
      .mob-menu__games,
      .mob-menu__open {
        border-top: 0;
        margin-top: 0;
        max-width: 280px;
      }
      .mob-menu__check {
        margin: 6px 0 2px;
        padding: 7px 10px;
        font-size: 13.5px;
      }
      .mob-menu__stop {
        margin-top: 6px;
        padding: 7px 10px;
      }

      /* Confetti */
      .confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 9;
        pointer-events: none;
        display: none;
      }
      .confetti.on {
        display: block;
      }
      .mob-menu__play {
        border-top: 0;
        margin-top: 0;
        max-width: 280px;
      }
      .mob-menu__outfit-label {
        margin-top: 8px;
      }
      .mob-menu__outfits .mob-menu__chip {
        flex: 0 0 auto;
        min-width: 32px;
        font-size: 15px;
        padding: 4px 6px;
      }
      .focus-badge {
        padding-left: 12px;
      }

      /* Notes badge */
      .notes-badge {
        position: fixed;
        left: 0;
        top: 0;
        will-change: transform;
        z-index: 7;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 5px 6px 5px 11px;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.94);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 18px rgba(0, 0, 0, 0.3);
        color: #fff;
        font: 600 12.5px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        white-space: nowrap;
        cursor: default;
      }
      .notes-badge.on {
        display: flex;
      }
      .notes-badge__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4d5e;
      }
      .notes-badge.writing .notes-badge__dot {
        background: #ffd23f;
      }
      .notes-badge.problem .notes-badge__text {
        color: #ffb36b;
        white-space: normal;
        max-width: 300px;
      }
      .notes-badge__stop {
        padding: 3px 10px;
        border: 0;
        border-radius: 999px;
        background: #ffd23f;
        color: #2b2412;
        font: 700 12px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__result--notes {
        max-height: 280px;
      }
      .chat__suggestions {
        margin-top: 5px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .chat__suggestions s {
        color: #b4361c;
      }
      .chat__suggestions b {
        color: #2b8a3e;
      }
      .chat__asked {
        margin-bottom: 5px;
        font-size: 12.5px;
        font-weight: 600;
        color: #8a7a52;
      }
      .chat__notes-h {
        display: block;
        margin-top: 6px;
        color: #8a5a00;
      }

      /* My classes */
      .classes {
        position: fixed;
        z-index: 8;
        display: none;
        width: 470px;
        max-width: calc(100vw - 24px);
        padding: 12px 14px 12px;
        box-sizing: border-box;
        border-radius: 18px;
        background: #fffdf5;
        color: #2b2412;
        box-shadow: 0 0 0 3px #3b2f14, 0 10px 28px rgba(0, 0, 0, 0.3);
        font: 500 14px/1.3 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
      }
      .classes.on {
        display: block;
      }
      .classes__head {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .classes__title {
        flex: 1;
        font-weight: 800;
        font-size: 15px;
      }
      .classes__close {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #7a6a42;
        font: 600 18px/24px system-ui, sans-serif;
        cursor: pointer;
      }
      .classes__close:hover {
        background: rgba(0, 0, 0, 0.07);
      }
      .classes__week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        min-height: 150px;
      }
      .classes__col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: #fff4d1;
        min-width: 0;
      }
      .classes__col.is-today {
        background: #ffe48a;
        box-shadow: inset 0 0 0 2px #e0a800;
      }
      .classes__colhead {
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        color: #6b5a2e;
      }
      .classes__chip {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 4px 5px;
        border: 0;
        border-left: 4px solid var(--c);
        border-radius: 6px;
        background: #fff;
        color: #2b2412;
        font: 600 11px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
      }
      .classes__chip b {
        font-size: 10.5px;
        color: #7a6a42;
      }
      .classes__chip span {
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .classes__chip:hover {
        filter: brightness(0.96);
      }
      .classes__foot {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .classes__hint {
        font-size: 12px;
        color: #7a6a42;
      }
      .classes__form {
        display: none;
        flex-direction: column;
        gap: 9px;
      }
      .classes.editing .classes__form {
        display: flex;
      }
      .classes.editing .classes__view {
        display: none;
      }
      .classes__field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        font-size: 12px;
        font-weight: 700;
        color: #6b5a2e;
      }
      .classes__field input {
        padding: 7px 10px;
        border: 2px solid #3b2f14;
        border-radius: 10px;
        background: #fff;
        color: #2b2412;
        font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }
      .classes__field input:focus {
        border-color: #e0a800;
        box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.45);
      }
      .classes__row {
        display: flex;
        gap: 10px;
      }
      .classes__days {
        display: flex;
        gap: 4px;
      }
      .classes__day {
        flex: 1;
        padding: 6px 0;
        border: 2px solid #3b2f14;
        border-radius: 9px;
        background: #fff;
        color: #2b2412;
        font: 700 12px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .classes__day.is-on {
        background: #ffd23f;
      }
      .classes__error {
        min-height: 16px;
        color: #b4361c;
        font-size: 12.5px;
        font-weight: 600;
      }
      .classes__error:empty {
        display: none;
      }
      .classes__actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .classes__spacer {
        flex: 1;
      }
      .classes__btn {
        padding: 6px 11px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #fff;
        color: #2b2412;
        font: 700 13px/1.1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .classes__delete {
        color: #b4361c;
        border-color: #b4361c;
      }

      /* Live captions */
      .captions {
        position: fixed;
        z-index: 7;
        display: none;
        width: 420px;
        max-width: calc(100vw - 24px);
        padding: 8px 12px 10px;
        box-sizing: border-box;
        border-radius: 16px;
        background: rgba(24, 24, 27, 0.94);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 28px rgba(0, 0, 0, 0.35);
        color: #fff;
        font: 500 15px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
      }
      .captions.on {
        display: block;
      }
      .captions__head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.7);
      }
      .captions__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        transition: transform 80ms linear;
      }
      .captions__dot.live {
        background: #ff4d5e;
      }
      .captions__title {
        font-weight: 700;
        margin-right: auto;
      }
      .captions.busy .captions__title::after {
        content: ' · …';
      }
      .captions__chip {
        padding: 2px 7px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 13px;
        cursor: pointer;
        opacity: 0.45;
      }
      .captions__chip.is-on {
        opacity: 1;
        background: rgba(255, 210, 63, 0.35);
      }
      .captions__lang {
        margin-left: 2px;
      }
      .captions__close {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        font: 600 17px/22px system-ui, sans-serif;
        cursor: pointer;
      }
      .captions__close:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .captions__lines {
        display: flex;
        flex-direction: column;
        gap: 6px;
        user-select: text;
        -webkit-user-select: text;
      }
      .captions__line {
        animation: captions-in 180ms ease-out;
      }
      @keyframes captions-in {
        from { transform: translateY(6px); opacity: 0; }
      }
      .captions__who {
        margin-right: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
      .captions__tr {
        margin-top: 1px;
        color: #ffd23f;
        font-weight: 600;
      }
      .captions__notice {
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.75);
      }
      .captions__notice.is-problem {
        color: #ffb36b;
      }

      /* Small games next to the pet */
      .game-panel {
        position: fixed;
        z-index: 6;
        display: none;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 10px 12px 11px;
        box-sizing: border-box;
        border-radius: 18px;
        background: #fffdf5;
        color: #2b2412;
        box-shadow: 0 0 0 3px #3b2f14, 0 10px 28px rgba(0, 0, 0, 0.3);
        font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
      }
      .game-panel.on {
        display: block;
      }
      .game-panel__head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .game-panel__title {
        font-weight: 800;
      }
      .game-panel__score {
        margin-left: auto;
        color: #7a6a42;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .game-panel__close {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #7a6a42;
        font: 600 18px/24px system-ui, sans-serif;
        cursor: pointer;
      }
      .game-panel__close:hover {
        background: rgba(0, 0, 0, 0.07);
      }
      .game-panel__body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .game-panel__msg {
        margin-top: 8px;
        max-width: 300px;
        min-height: 18px;
        text-align: center;
        font-weight: 500;
        font-size: 13px;
        color: #4a3d1c;
      }
      .game-btn {
        padding: 6px 14px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #ffd23f;
        color: #2b2412;
        font: 700 13.5px/1.1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .game-btn:hover {
        background: #ffc400;
      }
      .game-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Tic-tac-toe */
      .ttt {
        display: grid;
        grid-template-columns: repeat(3, 58px);
        gap: 5px;
        padding: 5px;
        border-radius: 12px;
        background: #3b2f14;
      }
      .ttt__cell {
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 8px;
        background: #fff7dc;
        font-size: 30px;
        line-height: 58px;
        cursor: pointer;
        transition: background 120ms ease, transform 120ms ease;
      }
      .ttt__cell:not(:disabled):hover {
        background: #ffe9a3;
      }
      .ttt__cell:disabled {
        cursor: default;
        color: inherit;
        opacity: 1;
      }
      .ttt__cell--on {
        animation: game-pop 220ms ease-out;
      }
      .ttt__cell--win {
        background: #ffd23f;
      }
      @keyframes game-pop {
        0% { transform: scale(0.5); }
        70% { transform: scale(1.12); }
        100% { transform: scale(1); }
      }

      /* Rock paper scissors */
      .rps__arena {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .rps__side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .rps__hand {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #fff1c2;
        font-size: 38px;
        line-height: 64px;
        text-align: center;
      }
      .rps--shake .rps__hand {
        animation: rps-shake 330ms ease-in-out infinite;
      }
      @keyframes rps-shake {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .rps__label {
        font-size: 12px;
        color: #7a6a42;
      }
      .rps__vs {
        font-weight: 800;
        color: #b39448;
      }
      .rps__buttons {
        display: flex;
        gap: 6px;
      }
      .rps__btn {
        padding: 6px 9px;
      }

      /* Cups */
      .cups {
        position: relative;
        width: 300px;
        height: 104px;
        border-radius: 12px;
        background: linear-gradient(#fff7dc 0 70%, #e9d7a6 70% 100%);
        overflow: hidden;
      }
      .cups__seed {
        position: absolute;
        bottom: 16px;
        width: 30px;
        margin-left: -15px;
        font-size: 24px;
        text-align: center;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .cups__cup {
        position: absolute;
        bottom: 12px;
        width: 76px;
        height: 74px;
        padding: 0;
        border: 0;
        background: #d8323c;
        clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        transition-property: left, transform;
        transition-timing-function: ease-in-out;
        transform: translateY(0);
      }
      .cups__cup:disabled {
        cursor: default;
      }
      .cups__cup:not(:disabled):hover {
        filter: brightness(1.1);
      }
      .cups__band {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        height: 12px;
        background: #fff;
        opacity: 0.85;
      }
      .cups__cup--up {
        transform: translateY(-46px);
        transition-duration: 260ms !important;
      }
      .cups__cup--moving {
        z-index: 2;
        filter: brightness(1.08);
      }

      /* Bubbles */
      .bubbles__time {
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .bubbles {
        position: fixed;
        z-index: 4;
        display: none;
        pointer-events: none;
      }
      .bubbles.on {
        display: block;
      }
      .bubbles.live {
        pointer-events: auto;
        cursor: crosshair;
      }

      /* Ping pong */
      .pong {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        display: none;
      }
      .pong.on {
        display: block;
      }
      .pong-hud {
        position: fixed;
        z-index: 6;
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        max-width: 230px;
        padding: 7px 8px 7px 12px;
        border-radius: 14px;
        background: rgba(44, 44, 46, 0.95);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.35);
        color: #fff;
        font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
      }
      .pong-hud.on {
        display: flex;
      }
      .pong-hud__score {
        flex: 1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .pong-hud__btn {
        border: 0;
        border-radius: 9px;
        padding: 4px 9px;
        background: rgba(255, 255, 255, 0.14);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .pong-hud__btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .pong-hud__again {
        display: none;
        background: #ffd23f;
        color: #2b2412;
      }
      .pong-hud__again:hover {
        background: #ffc400;
      }
      .pong-hud.over .pong-hud__again {
        display: inline-block;
      }
      .pong-hud__msg {
        flex-basis: 100%;
        font-weight: 500;
        font-size: 12.5px;
        opacity: 0.85;
      }
      .pong-hud__msg:empty {
        display: none;
      }

      /* Speech bubble chat */
      .chat {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        width: 330px;
        max-width: calc(100vw - 20px);
        padding: 12px 12px 10px;
        box-sizing: border-box;
        border-radius: 20px;
        background: #fffdf5;
        color: #2b2412;
        box-shadow: 0 0 0 3px #3b2f14, 0 10px 30px rgba(0, 0, 0, 0.35);
        font: 500 14.5px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: auto;
        opacity: 0;
        visibility: hidden;
        transition: opacity 140ms ease, visibility 0s linear 140ms;
        will-change: transform;
      }
      .chat.open,
      .chat.toast {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      /* Pop-ups you can drag (see PanelStack.js) */
      .panel-dragging,
      .panel-dragging * {
        cursor: grabbing !important;
        user-select: none;
      }
      .chat.panel-nudged .chat__tail {
        display: none;
      }
      .chat__tail {
        position: absolute;
        bottom: -11px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        background: #fffdf5;
        box-shadow: 3px 3px 0 0 #3b2f14;
        transform: rotate(45deg);
      }
      .chat.side .chat__tail,
      .chat.ghost .chat__tail {
        display: none;
      }
      .chat__close {
        position: absolute;
        top: 6px;
        right: 8px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #7a6a42;
        font: 600 18px/24px system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__close:hover {
        background: rgba(0, 0, 0, 0.07);
      }
      .chat__log {
        max-height: 220px;
        overflow-y: auto;
        padding-right: 22px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        user-select: text;
        -webkit-user-select: text;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .chat__msg--me {
        align-self: flex-end;
        max-width: 85%;
        margin-right: -22px;
        padding: 6px 11px;
        border-radius: 14px 14px 4px 14px;
        background: #ffd23f;
      }
      .chat__msg--pet {
        align-self: flex-start;
        max-width: 100%;
      }
      .chat__msg--error {
        color: #9a3b12;
      }
      .chat__msg--alert {
        font-weight: 700;
      }
      .chat__msg--typing {
        display: flex;
        gap: 5px;
        padding: 6px 0;
      }
      .chat__msg--typing span {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: #b39448;
        animation: chat-dot 1s infinite ease-in-out;
      }
      .chat__msg--typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .chat__msg--typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes chat-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
      .chat__form {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .chat__input {
        flex: 1;
        min-width: 0;
        padding: 8px 11px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #fff;
        color: #2b2412;
        font: inherit;
        outline: none;
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
      }
      .chat__input:focus {
        border-color: #e0a800;
        box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.45);
      }
      .chat__send {
        width: 40px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #ffd23f;
        color: #3b2f14;
        font: 700 16px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__send:hover {
        background: #ffc400;
      }
      .chat.busy .chat__send {
        opacity: 0.5;
        cursor: progress;
      }
      .chat__hint {
        margin-top: 6px;
        font-size: 11.5px;
        color: #8a7a52;
      }
      .chat__note,
      .chat__actions {
        display: none;
      }
      .chat.toast .chat__note {
        display: block;
        padding-right: 22px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .chat.toast .chat__form,
      .chat.toast .chat__hint,
      .chat.toast .chat__log {
        display: none;
      }
      .chat__note .chat__msg--typing {
        padding: 6px 0 0;
      }
      .chat__result {
        margin-top: 6px;
        max-height: 230px;
        overflow-y: auto;
        font-weight: 500;
        user-select: text;
        -webkit-user-select: text;
      }
      .chat.result .chat__actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .chat__inbox-intro {
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eadfc4;
        font-weight: 700;
      }
      .chat__inbox small {
        display: block;
        margin-top: 2px;
        color: #8a7a52;
        font-size: 12px;
      }
      .chat__inbox-sum {
        margin-top: 6px;
        white-space: pre-wrap;
      }
      .chat__inbox-q {
        margin-top: 6px;
        font-weight: 700;
      }
      .chat__inbox-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .chat__inbox-acts .chat__act {
        flex: 1 1 auto;
        padding: 7px 8px;
        font-size: 13px;
      }
      .chat__todo {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #eadfc4;
      }
      .chat__todo .chat__inbox-acts {
        margin-top: 6px;
      }
      .chat__inbox-result {
        white-space: pre-line;
        max-height: 220px;
        overflow-y: auto;
      }
      .chat__quiz-q {
        margin: 10px 0 6px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
      }
      .chat__quiz-a {
        margin-bottom: 8px;
        padding: 8px 10px;
        background: #fff3c4;
        border-radius: 10px;
        font-size: 15px;
      }
      .chat.toast .chat__note:has(.chat__todo) {
        max-height: 330px;
        overflow-y: auto;
      }
      .chat__draft {
        width: 100%;
        box-sizing: border-box;
        min-height: 84px;
        padding: 8px;
        border: 2px solid #3b2f14;
        border-radius: 10px;
        font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        resize: vertical;
        user-select: text;
        -webkit-user-select: text;
      }
      .chat__act {
        flex: 1;
        padding: 7px 10px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #fff;
        color: #3b2f14;
        font: 700 14px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__replace {
        background: #ffd23f;
      }
      .chat__act:hover {
        filter: brightness(0.95);
      }
      .chat__act:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .chat.toast {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
