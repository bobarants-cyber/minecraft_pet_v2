<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob: ws://localhost:5173 http://localhost:5173" />
    <title>Minecraft Mob</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      body.grab {
        cursor: grab;
      }
      body.grab:active {
        cursor: grabbing;
      }
      .mob-menu {
        position: fixed;
        z-index: 10;
        min-width: 230px;
        padding: 6px;
        box-sizing: border-box;
        border-radius: 14px;
        background: rgba(44, 44, 46, 0.78);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 32px rgba(0, 0, 0, 0.4);
        color: #fff;
        font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
        opacity: 0;
        transform: scale(0.96);
        visibility: hidden;
        transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
      }
      .mob-menu.open {
        opacity: 1;
        transform: none;
        visibility: visible;
        transition-delay: 0s;
      }
      .mob-menu__row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 28px;
        width: 100%;
        padding: 9px 12px;
        box-sizing: border-box;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .mob-menu__row:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .mob-menu__value {
        opacity: 0.85;
      }
      .mob-menu__text {
        padding: 8px 12px 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        margin-top: 4px;
      }
      .mob-menu__text-label {
        font-size: 12.5px;
        opacity: 0.75;
      }
      .mob-menu__chips {
        display: flex;
        gap: 6px;
        margin-top: 7px;
      }
      .mob-menu__chip {
        flex: 1;
        padding: 6px 4px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        font: 600 12.5px/1.1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .mob-menu__chip:hover {
        background: rgba(255, 255, 255, 0.24);
      }

      /* Ping pong */
      .pong {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        display: none;
      }
      .pong.on {
        display: block;
      }
      .pong-hud {
        position: fixed;
        z-index: 6;
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        max-width: 230px;
        padding: 7px 8px 7px 12px;
        border-radius: 14px;
        background: rgba(44, 44, 46, 0.82);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.35);
        color: #fff;
        font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: default;
      }
      .pong-hud.on {
        display: flex;
      }
      .pong-hud__score {
        flex: 1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .pong-hud__btn {
        border: 0;
        border-radius: 9px;
        padding: 4px 9px;
        background: rgba(255, 255, 255, 0.14);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .pong-hud__btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .pong-hud__again {
        display: none;
        background: #ffd23f;
        color: #2b2412;
      }
      .pong-hud__again:hover {
        background: #ffc400;
      }
      .pong-hud.over .pong-hud__again {
        display: inline-block;
      }
      .pong-hud__msg {
        flex-basis: 100%;
        font-weight: 500;
        font-size: 12.5px;
        opacity: 0.85;
      }
      .pong-hud__msg:empty {
        display: none;
      }

      /* Speech bubble chat */
      .chat {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        width: 330px;
        max-width: calc(100vw - 20px);
        padding: 12px 12px 10px;
        box-sizing: border-box;
        border-radius: 20px;
        background: #fffdf5;
        color: #2b2412;
        box-shadow: 0 0 0 3px #3b2f14, 0 10px 30px rgba(0, 0, 0, 0.35);
        font: 500 14.5px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        cursor: auto;
        opacity: 0;
        visibility: hidden;
        transition: opacity 140ms ease, visibility 0s linear 140ms;
        will-change: transform;
      }
      .chat.open,
      .chat.toast {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      .chat__tail {
        position: absolute;
        bottom: -11px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        background: #fffdf5;
        box-shadow: 3px 3px 0 0 #3b2f14;
        transform: rotate(45deg);
      }
      .chat.side .chat__tail {
        display: none;
      }
      .chat__close {
        position: absolute;
        top: 6px;
        right: 8px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #7a6a42;
        font: 600 18px/24px system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__close:hover {
        background: rgba(0, 0, 0, 0.07);
      }
      .chat__log {
        max-height: 220px;
        overflow-y: auto;
        padding-right: 22px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        user-select: text;
        -webkit-user-select: text;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .chat__msg--me {
        align-self: flex-end;
        max-width: 85%;
        margin-right: -22px;
        padding: 6px 11px;
        border-radius: 14px 14px 4px 14px;
        background: #ffd23f;
      }
      .chat__msg--pet {
        align-self: flex-start;
        max-width: 100%;
      }
      .chat__msg--error {
        color: #9a3b12;
      }
      .chat__msg--alert {
        font-weight: 700;
      }
      .chat__msg--typing {
        display: flex;
        gap: 5px;
        padding: 6px 0;
      }
      .chat__msg--typing span {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: #b39448;
        animation: chat-dot 1s infinite ease-in-out;
      }
      .chat__msg--typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .chat__msg--typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes chat-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
      .chat__form {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .chat__input {
        flex: 1;
        min-width: 0;
        padding: 8px 11px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #fff;
        color: #2b2412;
        font: inherit;
        outline: none;
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
      }
      .chat__input:focus {
        border-color: #e0a800;
        box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.45);
      }
      .chat__send {
        width: 40px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #ffd23f;
        color: #3b2f14;
        font: 700 16px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__send:hover {
        background: #ffc400;
      }
      .chat.busy .chat__send {
        opacity: 0.5;
        cursor: progress;
      }
      .chat__hint {
        margin-top: 6px;
        font-size: 11.5px;
        color: #8a7a52;
      }
      .chat__note,
      .chat__actions {
        display: none;
      }
      .chat.toast .chat__note {
        display: block;
        padding-right: 22px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .chat.toast .chat__form,
      .chat.toast .chat__hint,
      .chat.toast .chat__log {
        display: none;
      }
      .chat__note .chat__msg--typing {
        padding: 6px 0 0;
      }
      .chat__result {
        margin-top: 6px;
        max-height: 230px;
        overflow-y: auto;
        font-weight: 500;
        user-select: text;
        -webkit-user-select: text;
      }
      .chat.result .chat__actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .chat__act {
        flex: 1;
        padding: 7px 10px;
        border: 2px solid #3b2f14;
        border-radius: 12px;
        background: #fff;
        color: #3b2f14;
        font: 700 14px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: pointer;
      }
      .chat__replace {
        background: #ffd23f;
      }
      .chat__act:hover {
        filter: brightness(0.95);
      }
      .chat__act:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .chat.toast {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
